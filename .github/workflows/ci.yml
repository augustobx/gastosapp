name: GastosApp CI
on:
  push:
    branches: [main, feat/fintech-voice-v2]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - run: npm test
      - run: node --check server.js && node --check lib/openai-health.js && node --check lib/gemini.js && node --check lib/speech-jobs.js && node --check lib/ai-usage.js && node --check lib/ai-chat.js && node --check public/app.js && node --check public/chat.js && node --check public/voice-errors.js && node --check public/speech-request.js && node --check public/ai-usage.js && node --check public/express.js && node --check public/express-parse.js && node --check public/installments.js && node --check public/loan-edit.js && node --check public/movement-sort.js && node --check public/movement-table.js && node --check public/diagnostics.js && node --check public/providers.js && node --check lib/engine.js && node --check lib/loan-overdue.js && node --check lib/ai-chat.js && node --check db.js
