<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  
  <!-- Inner Glass Card -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="#0f172a" />
  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" filter="url(#shadow)" />

  <!-- Finance Currency & Arrow Symbol -->
  <g transform="translate(136, 116)">
    <!-- Upward Trend Arrow -->
    <path d="M 180 50 L 220 50 L 220 90 M 220 50 L 140 130 L 100 90 L 30 160" fill="none" stroke="#34d399" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dollar Sign -->
    <path d="M 120 40 L 120 240 M 165 95 C 165 65 145 60 120 60 C 90 60 75 75 75 100 C 75 140 165 130 165 180 C 165 210 145 220 120 220 C 90 220 70 205 70 175" 
          fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
