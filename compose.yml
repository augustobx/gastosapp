services:
  web:
    build: .
    container_name: gastosapp-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      TZ: America/Argentina/Buenos_Aires
      APP_PASSWORD: ${APP_PASSWORD:?Definir APP_PASSWORD con al menos 12 caracteres en .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_NLU_MODEL: ${OPENAI_NLU_MODEL:-gpt-4o-mini}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-marin}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_NLU_MODEL: ${GEMINI_NLU_MODEL:-gemini-3.8-flash}
      GEMINI_STT_MODEL: ${GEMINI_STT_MODEL:-gemini-3.8-flash}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-3.8-flash-tts}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Kore}
    volumes:
      - gastosapp-data:/app/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  gastosapp-data:
    name: gastosapp-data
networks:
  proxy:
    external: true
