services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastosapp-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - gastosapp-data:/app/data
    networks:
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gastosapp-data:
    name: gastosapp-data

networks:
  proxy:
    external: true
